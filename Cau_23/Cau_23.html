<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Câu 23</title></head><body>
<h2>Câu 23 - Tính lương tháng</h2>
<table border="1" cellpadding="8">
<tr><td>Họ tên</td><td><input id="name" value="Nguyễn Văn A"></td></tr>
<tr><td>Lương</td><td><input type="number" id="salary" value="5000000"></td></tr>
<tr><td>Hệ số lương</td><td><input type="number" id="hs" value="2.5" step="0.1"></td></tr>
<tr><td colspan="2"><button onclick="calc()">Tính lương tháng</button></td></tr></table>
<p id="result"></p>
<script>function calc(){let n=document.getElementById('name').value,s=+document.getElementById('salary').value,h=+document.getElementById('hs').value;document.getElementById('result').innerHTML='Nhân viên: '+n+'<br>Lương tháng: '+(s*h).toLocaleString('vi-VN')+' VNĐ';}</script>
</body></html>
